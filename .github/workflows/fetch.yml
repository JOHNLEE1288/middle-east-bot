name: Fetch Saudi News

on:
  schedule:
    # GitHub 使用 UTC 时间，比北京时间晚 8 小时
    # 北京时间 13:30 (中东上午高峰期)，赶在腾讯云 14:00 拉取前
    - cron: '30 5 * * *' 
    
    # 北京时间 17:30 (中东下午高峰期)，赶在腾讯云 18:00 拉取前
    - cron: '30 9 * * *' 
    
    # 北京时间 21:30 (中东晚间新闻期)，赶在腾讯云 22:00 拉取前
    - cron: '30 13 * * *' 
    
  workflow_dispatch: # 允许你随时手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests feedparser beautifulsoup4
      - run: python fetch_news.py
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git commit -m "Update Saudi News" || exit 0
          git push
